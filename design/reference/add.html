/* ------------------------------------------------------------------------------------------
   Tokens, light (the default)
   ------------------------------------------------------------------------------------------ */
:root {
  color-scheme: light;

  /* The six named colors. Contrast (WCAG 2) is in DESIGN.md; every text pair is AA or better. */
  --paper: #FFFFFF;          /* 感熱紙 Thermal paper: slips, stubs, tickets, panels, bottom bar */
  --counter: #EAE8E3;        /* 櫃台 Counter: the warm stone the paper lies on (page background) */
  --ink: #1F2328;            /* 墨 Ink: text, neutral amounts, the printer and register body */
  --ink-2: #575E66;          /* 褪色 Faded print: secondary text, leaders, 你沒參與, the stamp */
  --carbon: #2247C2;         /* 複寫藍 Carbon blue: money coming to you (欠你, 你借出, 你可以拿回) */
  --red: #B0321B;            /* 收銀紅 Register red: money you owe (你欠, 你借入), sync failed */

  /* Money roles. Components use these, not the raw names, so the meaning stays in one place. */
  --money-pos: var(--carbon);
  --money-neg: var(--red);
  --money-neutral: var(--ink);

  /* Derived from the six (not new colors) */
  --printer: #1F2328;        /* printer band (top of reading screens) and register (add sheet) */
  --printer-key: #2C3137;    /* digit keys on the register */
  --printer-key-2: #3A4047;  /* operator and delete keys on the register */
  --slot: #0A0C0E;           /* the paper slot */
  --on-printer: #F2F1EE;     /* 13.99:1 on --printer */
  --on-printer-2: #AEB4BA;   /* 7.55:1 on --printer */
  --on-printer-pos: #9DB4FF; /* 7.83:1 on --printer: 你可以拿回 in the collapsed band */
  --on-printer-neg: #FF9A85; /* 7.68:1 on --printer */
  --hair: rgb(31 35 40 / 0.12);
  --hair-2: rgb(31 35 40 / 0.24);
  --track: rgb(31 35 40 / 0.07);   /* segmented control track */
  --press: rgb(31 35 40 / 0.06);   /* row press and hover */
  --leader: rgb(87 94 102 / 0.75); /* dotted leaders on slips */
  --scrim: rgb(12 13 15 / 0.45);
  --key: var(--ink);               /* the primary key on light surfaces (新增費用, buttons) */
  --on-key: #F2F1EE;
  --key-press: #353A40;
  --key-inv: var(--paper);         /* the primary key on the register (儲存) */
  --on-key-inv: var(--ink);
  --on-key-inv-2: #575E66;         /* the group name on the 儲存 key: 6.57:1 */
  --danger: var(--red);            /* destructive confirm fill */
  --on-danger: #FFFFFF;            /* on --danger: 6.33:1 */
  --seg-on: var(--paper);
  --stamp: var(--ink-2);           /* solid, AA: 6.57:1 on paper, 5.36:1 on counter */
  --focus: var(--carbon);          /* focus ring; the printer band overrides it to --on-printer-pos */
  --desk: #DEDBD4;                 /* behind the centered phone column on 600 to 899 px */

  /* People, groups and categories: a tint of the stored color (src/shared/colors.ts) mixed into
     paper, like carbonless copy paper. Initials and glyphs stay ink. Never used for money. */
  --tint-mix: 24%;
  --hue-food: #D4A017;
  --hue-transport: #2F8F7F;
  --hue-travel: #7B6BC9;
  --hue-entertainment: #CC5F8A;
  --hue-home: #CF7F3E;
  --hue-utilities: #6F7C8A;
  --hue-life: #4E9A5D;
  --hue-other: #8A8F96;

  /* Charts (統計). Validated ordinal ramp, one hue, light end 3.15:1 on paper. */
  --chart-1: #1F2328;        /* 付了 paid, the main series */
  --chart-2: #8A929B;        /* 分到 share, the second series */
  --chart-grid: rgb(31 35 40 / 0.10);

  /* Type */
  --font-text: "Hanken Grotesk", "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --font-num: "Chivo Mono", "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC", ui-monospace, Menlo, Consolas, monospace;
  --fs-11: 11px;   /* weekday under a day number */
  --fs-12: 12px;   /* tab labels, sync chip, face names, hints (only the ticket currency code is smaller, 10 px) */
  --fs-13: 13px;   /* row subtitles, stub labels, footnotes, chips small */
  --fs-15: 15px;   /* slip labels, segmented control, links, secondary buttons */
  --fs-16: 16px;   /* expense titles, stub amounts, slip leader amounts */
  --fs-17: 17px;   /* body, row titles, list amounts, every text input */
  --fs-20: 20px;   /* converted amount on the add slip */
  --fs-24: 24px;   /* keypad digits */
  --fs-34: 34px;   /* 總覽 totals */
  --fs-40: 40px;   /* a group's status */
  --fs-56: 56px;   /* the amount being entered */
  --lh-text: 1.45;
  --lh-row: 1.3;
  --lh-num: 1.1;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --sep-pull: -0.17em;       /* comma and point pulled in on each side inside .amt */
  --cur-scale: 0.6;          /* currency prefix size at display sizes (34 px and up) */

  /* Space (4 px base) */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --gutter: 16px;

  /* Sizes */
  --tap: 44px;               /* minimum touch target */
  --band-h: 50px;            /* printer band bar, without the slot and safe area */
  --row-h: 60px;             /* friend and group rows */
  --exp-row-h: 64px;         /* expense rows */
  --tabbar-h: 64px;          /* bottom bar, without the safe area */
  --key-h: 46px;             /* register keys; 44 px under 680 px tall, 52 px at 760 px and up */
  --sidebar-w: 248px;        /* desktop, 900 px and wider */
  --content-max: 760px;
  --sheet-max-w: 480px;      /* desktop dialog width */

  /* Radii: by what the object is, not one value everywhere */
  --r-stub-torn: 2px;
  --r-ticket: 6px;
  --r-stamp: 8px;
  --r-tile: 10px;
  --r-chip: 12px;
  --r-key: 12px;
  --r-seg: 14px;
  --r-seg-on: 11px;
  --r-primary: 15px;
  --r-panel: 16px;
  --r-sheet: 20px;           /* picker sheets */
  --r-sheet-page: 14px;      /* full-height page sheet (新增費用) */
  --r-pill: 999px;

  /* Elevation. Paper casts filter shadows so they follow torn and notched edges. */
  --lift-1: drop-shadow(0 0.5px 0.5px rgb(31 35 40 / 0.22));
  --lift-2: drop-shadow(0 1px 0.5px rgb(31 35 40 / 0.16)) drop-shadow(0 10px 14px rgb(31 35 40 / 0.11));
  --lift-3: 0 24px 48px -12px rgb(12 13 15 / 0.35), 0 0 0 1px var(--hair);
  --shadow-key: 0 1px 0 rgb(255 255 255 / 0.08) inset, 0 6px 14px -6px rgb(31 35 40 / 0.55);
  --shadow-seg: 0 1px 2px rgb(31 35 40 / 0.14), 0 0 0 0.5px rgb(31 35 40 / 0.08);
  --edge-light: 0 0 0 0 transparent;  /* dark mode replaces shadows with a light edge */

  /* Motion: only where it says something (DESIGN.md, Motion) */
  --ease-out: cubic-bezier(0.22, 0.8, 0.24, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --dur-press: 110ms;
  --dur-quick: 160ms;
  --dur-stamp: 180ms;
  --dur-print: 240ms;        /* slip feed, in --print-steps steps; only when a number changed */
  --print-steps: 6;
  --dur-sheet: 280ms;

  /* Safe areas (need viewport-fit=cover) */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);

  /* Layers */
  --z-sticky: 3;
  --z-band: 5;
  --z-bar: 10;
  --z-sheet: 20;
  --z-toast: 30;
}

/* ------------------------------------------------------------------------------------------
   Tokens, dark ("night counter"). Same structure, swapped values. The two blocks below must
   stay identical: one follows the OS, the other is the in-app override.
   ------------------------------------------------------------------------------------------ */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #22201E;
    --counter: #161514;
    --ink: #EDEBE6;
    --ink-2: #A9A49B;
    --carbon: #8EA8FF;
    --red: #FF8A73;
    --printer: #0C0B0A;
    --printer-key: #24272B;
    --printer-key-2: #31353A;
    --slot: #000000;
    --on-printer: #EDEBE6;
    --on-printer-2: #A3A7AC;
    --on-printer-pos: #8EA8FF;
    --on-printer-neg: #FF8A73;
    --hair: rgb(237 235 230 / 0.10);
    --hair-2: rgb(237 235 230 / 0.20);
    --track: rgb(237 235 230 / 0.07);
    --press: rgb(237 235 230 / 0.06);
    --leader: rgb(169 164 155 / 0.7);
    --scrim: rgb(0 0 0 / 0.6);
    --key: #EDEBE6;
    --on-key: #161514;
    --key-press: #D6D3CC;
    --key-inv: #EDEBE6;
    --on-key-inv: #161514;
    --on-key-inv-2: #57534D;
    --on-danger: #161514;
    --seg-on: #34312D;
    --desk: #0C0B0A;
    --tint-mix: 30%;
    --chart-1: #E3E6EA;
    --chart-2: #7E8792;
    --chart-grid: rgb(237 235 230 / 0.10);
    --lift-1: drop-shadow(0 0 0.5px rgb(237 235 230 / 0.28));
    --lift-2: drop-shadow(0 0 0.5px rgb(237 235 230 / 0.22)) drop-shadow(0 10px 14px rgb(0 0 0 / 0.5));
    --lift-3: 0 24px 48px -12px rgb(0 0 0 / 0.7), 0 0 0 1px var(--hair-2);
    --shadow-key: 0 0 0 0.5px rgb(237 235 230 / 0.2);
    --shadow-seg: 0 0 0 0.5px rgb(237 235 230 / 0.16);
    --edge-light: 0 0 0 0.5px rgb(237 235 230 / 0.16);
  }
}

  --lift-2: drop-shadow(0 0 0.5px rgb(237 235 230 / 0.22)) drop-shadow(0 10px 14px rgb(0 0 0 / 0.5));
  --lift-3: 0 24px 48px -12px rgb(0 0 0 / 0.7), 0 0 0 1px var(--hair-2);
  --shadow-key: 0 0 0 0.5px rgb(237 235 230 / 0.2);
  --shadow-seg: 0 0 0 0.5px rgb(237 235 230 / 0.16);
  --edge-light: 0 0 0 0.5px rgb(237 235 230 / 0.16);
}

/* Register key height follows the screen height so the add sheet fits Safari with toolbars */
@media (max-height: 679px) { :root { --key-h: 44px; } }
@media (min-height: 760px) { :root { --key-h: 52px; } }

/* ------------------------------------------------------------------------------------------
   Base element styles (the mobile-native floor)
   ------------------------------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--counter);
  -webkit-tap-highlight-color: transparent;  /* every control has its own :active state */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior: none;                 /* inner scrollers use contain */
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--counter);
  color: var(--ink);
  font: var(--fw-regular) var(--fs-17) / var(--lh-text) var(--font-text);
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

h1, h2, h3, h4, h5, h6, p, ul, ol, figure, blockquote, dl, dd { margin: 0; padding: 0; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: var(--fw-bold); line-height: var(--lh-row); }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
svg { flex: none; }
hr { margin: 0; border: 0; }
a { color: inherit; text-decoration: none; }

button {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: inherit;
  cursor: pointer;
}
button:disabled { cursor: default; }

/* Controls fire on tap without the double-tap wait, and long-press does not select their label */
button, a, [role="button"], [role="tab"], summary, label[for] {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* Inputs never go under 16 px, so iOS never zooms the page */
input, textarea, select {
  font: inherit;
  font-size: max(16px, 1em);
  color: inherit;
}
input::placeholder, textarea::placeholder { color: var(--ink-2); opacity: 1; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-chip);
}

::selection { background: color-mix(in srgb, var(--carbon) 24%, transparent); }

/* ------------------------------------------------------------------------------------------
   Utilities
   ------------------------------------------------------------------------------------------ */
.sr-only {
  position: absolute !important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* Tabular numerals in any font (the money font is monospaced already) */
.tnum { font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Money. Markup: <span class="amt"><span class="cur">¥</span>1<span class="sep">,</span>453<span class="sep">,</span>365</span>
   The .sep spans pull the comma and the point in, so long yen amounts read as one number.
   Never wraps. Direction is always said in words next to it; color only repeats the words. */
.amt {
  font-family: var(--font-num);
  font-weight: var(--fw-semibold);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  word-spacing: -0.25em;   /* a mono space is 0.6em; inside "12/20 16:12" or "NT$400 ≈ ¥1,900" it reads as a gap */
  white-space: nowrap;
}
.amt .sep { margin: 0 var(--sep-pull); }
.amt-display .cur { font-size: calc(var(--cur-scale) * 1em); margin-right: 0.08em; }
.pos { color: var(--money-pos); }
.neg { color: var(--money-neg); }
.neutral { color: var(--money-neutral); }
.mute { color: var(--ink-2); }

/* Hover lives only where hover is real (mouse or trackpad). Components add their own rules
   inside this same query; the bare :hover selector is never used. */
@media (hover: hover) and (pointer: fine) {
  a:hover { text-decoration: none; }
}

/* Reduced motion: every transition and animation becomes instant; values swap in place */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
    scroll-behavior: auto !important;
  }
}

/* Evenly reference mockups: shared component CSS. Uses only tokens from design/tokens.css.
   This is the visual reference for the React CSS Modules, not production code. */

.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- printer band: top of every reading screen ---------- */
.band {
  position: relative;
  z-index: var(--z-band);
  background: var(--printer);
  color: var(--on-printer);
  padding: calc(var(--safe-t) + 2px) calc(6px + var(--safe-r)) 22px calc(6px + var(--safe-l));
  --focus: var(--on-printer-pos);
}
.band::after {                                   /* the paper slot */
  content: "";
  position: absolute;
  left: 10px; right: 10px; bottom: 8px;
  height: 8px;
  border-radius: 4px;
  background: var(--slot);
  box-shadow: inset 0 2px 2px rgb(0 0 0 / 0.6), 0 1px 0 rgb(255 255 255 / 0.09);
}
.band-bar { display: flex; align-items: center; gap: 2px; min-height: var(--band-h); }
.icon-btn {
  position: relative;
  flex: none;
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center;
  border-radius: var(--r-chip);
  transition: background-color var(--dur-press) var(--ease-out);
}
.band .icon-btn:active { background: rgb(255 255 255 / 0.12); }

.wordmark { flex: 1; display: flex; align-items: baseline; gap: 9px; padding-left: 10px; }
.wordmark b { font: 700 21px/1 var(--font-num); letter-spacing: -0.03em; }
.wordmark span { font-size: 15px; font-weight: 600; letter-spacing: 0.1em; color: var(--on-printer-2); }
.me-av { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / 0.4); font-size: 14px; font-weight: 600; }

.band-head { flex: 1; min-width: 0; padding-left: 2px; }
.band-title { font-size: 17px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; font-size: 13px; line-height: 1.3; color: var(--on-printer-2); white-space: nowrap; overflow: hidden; }
.band-meta .code { flex: none; font: 600 11px/1 var(--font-num); padding: 3px 5px 2px; border-radius: 5px; color: var(--on-printer); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.32); }
.band-status { font-size: 13px; font-weight: 600; color: var(--on-printer-pos); }
.band-status .amt { font-size: 14px; }

.stack { flex: none; display: flex; align-items: center; min-height: var(--tap); padding: 0 6px 0 12px; border-radius: var(--r-chip); }
.stack .av { margin-left: -7px; padding-right: 6px; box-shadow: 0 0 0 2px var(--printer); }  /* initial nudged into the visible part */
.stack .av:nth-last-child(2) { padding-right: 0; }
.stack .more { margin-left: 4px; font: 600 12px/1 var(--font-num); color: var(--on-printer-2); }
.stack:active { background: rgb(255 255 255 / 0.1); }

/* ---------- the slip: paper fed out of the slot, torn on a serrated edge ---------- */
.slip-wrap {
  position: relative;
  z-index: calc(var(--z-band) + 1);
  margin: -13px var(--gutter) 0;
  filter: var(--lift-2);
  clip-path: inset(0 -28px -48px -28px);         /* hides paper above the slot while it feeds */
}
.slip {
  position: relative;
  background: var(--paper);
  padding: 15px 18px 20px;
  container-type: inline-size;                  /* amounts size from the slip width */
  -webkit-mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat,
    conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) bottom / 14px 7px repeat-x;
  mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - 7px) no-repeat,
    conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) bottom / 14px 7px repeat-x;
}
.slip::before {                                   /* shade where the paper leaves the slot */
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 14px;
  background: linear-gradient(rgb(31 35 40 / 0.13), rgb(31 35 40 / 0));
  pointer-events: none;
}
/* The print feed runs only when a number on this slip changed since the last view */
.slip.is-printing { animation: feed var(--dur-print) steps(var(--print-steps), end) both; }
@keyframes feed { from { transform: translateY(-100%); } to { transform: none; } }

.dash {
  height: 1.5px;
  margin: 10px 0;
  background: repeating-linear-gradient(90deg, var(--ink-2) 0 5px, transparent 5px 9px);
  opacity: 0.55;
}
.leader {
  flex: 1;
  min-width: 14px;
  height: 2px;
  background: radial-gradient(circle, var(--leader) 0.85px, transparent 1.25px) 0 50% / 6px 2px repeat-x;
}
.lead { display: flex; align-items: baseline; gap: 8px; font-size: 15px; line-height: 1.6; }
.lead > span:first-child { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lead .amt { font-size: 16px; }
.lead .val { flex: none; white-space: nowrap; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 10px; margin-top: 9px; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.foot + .foot { margin-top: 1px; }
.foot > span { white-space: nowrap; }
.foot > span + span { margin-left: auto; }
.foot .amt { font-weight: 500; }

/* ---------- scrolled past the slip: compact band + one-line strip that stays ---------- */
.band.compact { position: fixed; top: 0; left: 0; right: 0; padding-bottom: 18px; }
.band.compact .band-bar { min-height: 48px; }
.band.compact::after { bottom: 6px; }
.strip-wrap {
  position: fixed; left: 0; right: 0;
  top: calc(var(--safe-t) + 57px);
  z-index: calc(var(--z-band) + 1);
  display: block;
  padding: 0 var(--gutter);
  filter: var(--lift-2);
  clip-path: inset(0 -28px -48px -28px);
}
.strip {
  display: flex; align-items: center; gap: 8px;
  min-height: 39px;
  padding: 5px 8px 11px 16px;
  background: var(--paper);
  -webkit-mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat,
    conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) bottom / 12px 6px repeat-x;
  mask:
    linear-gradient(#000 0 0) top / 100% calc(100% - 6px) no-repeat,
    conic-gradient(from -45deg at 50% 100%, #000 90deg, #0000 0) bottom / 12px 6px repeat-x;
}
.strip .lbl { flex: none; font-size: 15px; font-weight: 700; }
.strip .amt { flex: none; font-size: 18px; }
.strip .ic { width: 18px; height: 18px; color: var(--ink-2); }
.strip-wrap:active .strip { background: color-mix(in srgb, var(--paper) 94%, var(--ink)); }

/* ---------- 總覽 tally ---------- */
.tally-k { font-size: 15px; font-weight: 700; line-height: 1.3; }
.tally-line { display: flex; align-items: baseline; gap: 8px; }
.tally-line .who { flex: 0 1 auto; min-width: 0; max-width: 46%; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally-line .amt { font-size: clamp(26px, 10.5cqw, var(--fs-34)); line-height: 1.14; }   /* 34 at 390, 26 floor */

/* ---------- group status ---------- */
.status { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.status h2 { font-size: 15px; font-weight: 700; }
.status .amt { font-size: clamp(30px, 12.4cqw, var(--fs-40)); line-height: 1.06; }   /* 40 at 390, 30 floor */
.settle-line {
  display: flex; align-items: center; gap: 8px;
  width: calc(100% + 12px);
  min-height: var(--tap);
  margin: 2px -6px 0;
  padding: 0 6px;
  border-radius: 10px;
  text-align: left;
  transition: background-color var(--dur-press) var(--ease-out);
}
.settle-line:active { background: var(--press); }
.settle-line .lbl { min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.settle-line .amt { font-size: 16px; }
.go {
  flex: none;
  display: inline-flex; align-items: center; gap: 2px;
  height: 32px;
  padding: 0 6px 0 11px;
  border-radius: 10px;
  box-shadow: inset 0 0 0 1.5px var(--ink);
  font-size: 14px; font-weight: 700;
  color: var(--ink);
}
.go .ic { width: 16px; height: 16px; stroke-width: 2.2; }

/* ---------- sections and rows ---------- */
.sec { margin-top: 18px; }
.sec + .sec { margin-top: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--gutter) 2px; }
.sec-h h2 { font-size: 17px; font-weight: 700; line-height: 1.3; }
.sec-link { display: inline-flex; align-items: center; min-height: var(--tap); margin: -12px -4px; padding: 0 4px; font-size: 15px; color: var(--ink-2); }
.row {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  min-height: var(--row-h);
  padding: 8px var(--gutter);
  transition: background-color var(--dur-press) var(--ease-out);
}
li + li > .row::before { content: ""; position: absolute; top: 0; left: 68px; right: var(--gutter); height: 1px; background: var(--hair); }
.row:active { background: var(--press); }
.row-main { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.row-t { font-size: 17px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-s { font-size: 13px; line-height: 1.4; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal { flex: none; display: grid; justify-items: end; text-align: right; }
.bal-k { font-size: 13px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
.bal .amt { font-size: 17px; line-height: 1.3; }

/* ---------- people ---------- */
.av {
  --av: #475569;
  width: 40px; height: 40px; flex: none;
  display: grid; place-items: center;
  border-radius: 12px;
  background: color-mix(in srgb, var(--av) var(--tint-mix), var(--paper));
  box-shadow: inset 0 0 0 1px var(--hair-2);
  font-size: 17px; font-weight: 600; line-height: 1;
  color: var(--ink);
}
.av.me { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }  /* you are the white original */
.av.sm { width: 26px; height: 26px; border-radius: 8px; font-size: 12px; }
.av.xs { width: 22px; height: 22px; border-radius: 7px; font-size: 11px; }

/* ---------- group ticket: the cover glyph, with the currency in small print ---------- */
.ticket-w { flex: none; filter: var(--lift-1); }
.ticket {
  --tk: #475569;
  width: 44px; height: 46px;
  display: grid; justify-items: center; align-content: center; gap: 2px;
  border-radius: var(--r-ticket);
  background: color-mix(in srgb, var(--tk) var(--tint-mix), var(--paper));
  color: var(--ink);
  -webkit-mask:
    radial-gradient(circle 4.5px at 0 50%, #0000 95%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 4.5px at 100% 50%, #0000 95%, #000) right / 51% 100% no-repeat;
  mask:
    radial-gradient(circle 4.5px at 0 50%, #0000 95%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle 4.5px at 100% 50%, #0000 95%, #000) right / 51% 100% no-repeat;
}
.ticket .ic { width: 22px; height: 22px; stroke-width: 1.6; }
.ticket b { font: 600 10px/1 var(--font-num); letter-spacing: 0.02em; }
.ticket.done { background: var(--paper); color: var(--ink-2); }

/* ---------- the stamp: only ever says 已結清; level, solid, AA ---------- */
.stamp {
  position: relative;
  flex: none;
  display: inline-grid; place-items: center;
  min-height: 34px;
  padding: 0 11px 0 12px;
  border: 2px solid currentColor;
  border-radius: var(--r-stamp);
  color: var(--stamp);
  font-size: 15px; font-weight: 700; line-height: 1;
  letter-spacing: 0.08em;
}
.stamp::after { content: ""; position: absolute; inset: 3px; border: 1px solid currentColor; border-radius: 5px; opacity: 0.8; }

/* ---------- bottom bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-bar);
  display: grid;
  grid-template-columns: 1fr 1fr minmax(96px, 1.65fr) 1fr 1fr;
  align-items: center;
  padding: 6px calc(6px + var(--safe-r)) calc(6px + var(--safe-b)) calc(6px + var(--safe-l));
  background: var(--paper);
  box-shadow: 0 -1px 0 var(--hair), var(--edge-light);
}
.tab {
  display: grid; justify-items: center; align-content: center; gap: 2px;
  min-height: 52px;
  font-size: 12px; font-weight: 500; line-height: 1.2;
  color: var(--ink-2);
}
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"] .ic { stroke-width: 2.2; }
.tab-add {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  height: 50px;
  margin: 0 4px;
  border-radius: var(--r-primary);
  background: var(--key);
  color: var(--on-key);
  font-size: 15px; font-weight: 700;
  white-space: nowrap;
  box-shadow: var(--shadow-key);
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press);
}
.tab-add .ic { width: 20px; height: 20px; stroke-width: 2.4; }
.tab-add:active { transform: scale(0.96); background: var(--key-press); }

/* ---------- segmented control (link tabs) ---------- */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin: 14px var(--gutter) 0; padding: 3px; border-radius: var(--r-seg); background: var(--track); }
.seg a { display: grid; place-items: center; min-height: var(--tap); border-radius: var(--r-seg-on); font-size: 15px; font-weight: 600; color: var(--ink-2); transition: background-color var(--dur-quick) var(--ease-out), color var(--dur-quick) var(--ease-out); }
.seg a[aria-current="page"] { background: var(--seg-on); color: var(--ink); box-shadow: var(--shadow-seg); }

/* ---------- expense list ---------- */
.month {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 14px var(--gutter) 5px;
  background: var(--counter);
  font-size: 15px; font-weight: 700; line-height: 1.4;
}
.month small { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.exp-list { --stub-w: 111px; }
.exp {
  position: relative;
  display: grid;
  grid-template-columns: 28px 36px minmax(0, 1fr) var(--stub-w);
  column-gap: 10px;
  align-items: center;
  min-height: var(--exp-row-h);
  padding: 7px var(--gutter);
  transition: background-color var(--dur-press) var(--ease-out);
}
li + li > .exp::before { content: ""; position: absolute; top: 0; left: 100px; right: var(--gutter); height: 1px; background: var(--hair); }
li + li > .exp.first::before { left: var(--gutter); background: var(--hair-2); }   /* a new day */
.exp:active { background: var(--press); }
.day { display: grid; justify-items: center; align-self: start; padding-top: 6px; line-height: 1; }
.day b { font: 600 17px/1 var(--font-num); }
.day small { margin-top: 4px; font-size: 11px; color: var(--ink-2); }
.cat {
  --hue: var(--hue-other);
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: var(--r-tile);
  background: color-mix(in srgb, var(--hue) var(--tint-mix), var(--paper));
  box-shadow: inset 0 0 0 1px var(--hair);
  color: var(--ink);
}
.cat .ic { width: 20px; height: 20px; }
.cat.pay { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hair-2); }
.exp-main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: start; }
.exp-t { max-width: 100%; font-size: 16px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-s { display: flex; align-items: baseline; max-width: 100%; font-size: 13px; line-height: 1.45; color: var(--ink-2); white-space: nowrap; }
.exp-s .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.exp-s .vb { flex: none; }
.exp-s .amt { flex: none; margin-left: 0.3em; font-weight: 500; }
.exp-fx { max-width: 100%; font-size: 13px; line-height: 1.4; color: var(--ink-2); }  /* wraps rather than cutting off the rate date */
.exp-fx .amt { font-weight: 500; }

/* your stub: torn off along the perforation, so its left edge keeps the holes */
.stub-w { justify-self: stretch; filter: var(--lift-1); }
.stub {
  display: grid; justify-items: end;
  padding: 6px 10px 6px 16px;
  border-radius: var(--r-stub-torn) 8px 8px var(--r-stub-torn);
  background: var(--paper);
  -webkit-mask: radial-gradient(circle at 0 50%, #0000 2.3px, #000 2.8px) 0 0 / 100% 7px repeat-y;
  mask: radial-gradient(circle at 0 50%, #0000 2.3px, #000 2.8px) 0 0 / 100% 7px repeat-y;
}
.stub-k { font-size: 13px; font-weight: 600; line-height: 1.35; white-space: nowrap; }
.stub .amt { font-size: 16px; line-height: 1.3; }
.none { justify-self: end; padding-right: 10px; text-align: right; font-size: 13px; color: var(--ink-2); white-space: nowrap; }

/* saved on this phone, not on the server yet: the stub is still attached (dashed, no holes) */
.exp.pending .stub-w { filter: none; }
.exp.pending .stub { background: transparent; outline: 1.5px dashed var(--ink-2); outline-offset: -1.5px; -webkit-mask: none; mask: none; }
.exp-st { display: flex; margin-top: 3px; }   /* expenses: the sync state gets its own line under the payer line */
.exp-s .sync { margin-left: 6px; }            /* payments: it follows the short method line */
.sync {
  flex: none;
  display: inline-flex; align-items: center; gap: 3px;
  padding: 0 6px 0 4px;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--hair-2);

.exp.failed .sync { color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.exp.deleted .exp-t, .exp.deleted .exp-s { text-decoration: line-through; text-decoration-thickness: 1px; }
.exp.deleted .day, .exp.deleted .cat, .exp.deleted .exp-main { opacity: 0.55; }
.meta-ic { display: inline-block; width: 14px; height: 14px; margin-left: 4px; vertical-align: -2px; color: var(--ink-2); }

/* ---------- buttons and chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: var(--r-chip);
  font-size: 15px; font-weight: 600; line-height: 1;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press);
}
.btn .ic { width: 18px; height: 18px; }
.btn:active { transform: scale(0.97); }
.btn-primary { min-height: 50px; padding: 0 20px; border-radius: var(--r-primary); background: var(--key); color: var(--on-key); font-size: 16px; font-weight: 700; box-shadow: var(--shadow-key); }
.btn-primary:active { background: var(--key-press); }
.btn-secondary { box-shadow: inset 0 0 0 1px var(--hair-2); color: var(--ink); }
.btn-secondary:active { background: var(--press); }
.btn-ghost { padding: 0 10px; color: var(--ink-2); }
.btn-ghost:active { background: var(--press); }
.btn-danger { background: var(--danger); color: var(--on-danger); font-weight: 700; }
.btn-danger-quiet { box-shadow: inset 0 0 0 1px var(--red); color: var(--red); }
.btn-sm { min-height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; position: relative; }
.btn-sm::before { content: ""; position: absolute; inset: -4px 0; }
.btn[disabled] { opacity: 0.4; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: var(--tap);
  padding: 0 8px 0 10px;
  border-radius: var(--r-chip);
  background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--hair-2);
  font-size: 16px; font-weight: 600; line-height: 1;
  color: var(--ink);
  white-space: nowrap;
  transition: background-color var(--dur-press) var(--ease-out);
}
.chip .ic { width: 16px; height: 16px; stroke-width: 2.2; color: var(--ink-2); }
.chip:active { background: var(--press); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }

/* ---------- wider windows: the phone column, until the desktop layout (DESIGN.md) ---------- */
@media (min-width: 600px) {
  html { background: var(--desk); }
  body { max-width: 480px; margin: 0 auto; box-shadow: 0 0 0 1px var(--hair); }
  .tabbar { left: 50%; right: auto; width: min(100%, 480px); transform: translateX(-50%); }
}

@media (hover: hover) and (pointer: fine) {
  .row:hover, .exp:hover, .settle-line:hover, .chip:hover, .btn-secondary:hover, .btn-ghost:hover { background: var(--press); }
  .band .icon-btn:hover, .stack:hover { background: rgb(255 255 255 / 0.08); }
  .tab:hover { color: var(--ink); }
}

/* 新增費用: the full-height sheet. The register (keypad) is at the bottom; the receipt you are

html, body { background: #121417; }
:root[data-theme="dark"] body, :root[data-theme="dark"] { background: #000000; }

.peek {                                         /* the group page, dimmed, behind the sheet */

.grabber { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--hair-2); }

.sheet-head { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; padding: 8px 6px 0; }
.text-btn { justify-self: start; display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 10px; border-radius: var(--r-chip); font-size: 17px; font-weight: 500; color: var(--ink); }
.text-btn:active { background: var(--press); }
.sheet-title { display: grid; justify-items: center; text-align: center; }
.sheet-title h1 { font-size: 17px; font-weight: 700; line-height: 1.2; }
.group-pick { position: relative; display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; padding: 0 2px; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--ink); }
.group-pick::before { content: ""; position: absolute; inset: -10px -14px; }
.group-pick .glyph { width: 16px; height: 16px; stroke-width: 1.8; }
.group-pick .dn { width: 15px; height: 15px; color: var(--ink-2); stroke-width: 2.2; }

.sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
/* the slip docks on the keypad when there is room; on short screens the body scrolls and opens scrolled to the bottom */

/* who is in: tap a face to leave someone out */
.beads { display: flex; justify-content: space-between; gap: 4px; padding: 8px var(--gutter) 0; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
.beads::-webkit-scrollbar { display: none; }
.bead { position: relative; flex: none; width: 50px; min-height: 58px; display: grid; justify-items: center; align-content: start; gap: 3px; padding-top: 2px; border-radius: 12px; scroll-snap-align: start; transition: background-color var(--dur-press) var(--ease-out); }
.bead:active { background: var(--press); }
.bead .av { width: 36px; height: 36px; border-radius: 11px; font-size: 15px; }
.bead .check { position: absolute; top: 25px; left: 31px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--counter); box-shadow: 0 0 0 2px var(--counter); }

.bead[aria-pressed="false"] .av { background: transparent; box-shadow: none; outline: 1.5px dashed var(--ink-2); outline-offset: -1.5px; color: var(--ink-2); }
.bead[aria-pressed="false"] .check { display: none; }
.hint { padding: 3px var(--gutter) 0; font-size: 12px; line-height: 1.4; color: var(--ink-2); text-align: center; }

/* paid by, split: one sentence with two blanks */
.who-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px var(--gutter) 0; font-size: 16px; font-weight: 500; }
.who-row .chip { position: relative; min-height: 40px; }
.who-row .chip::after { content: ""; position: absolute; inset: -2px 0; }   /* 44 px target */
.who-row .chip .av { width: 24px; height: 24px; border-radius: 7px; font-size: 11px; }

/* the register: slip on top, keys below */
.register { flex: none; position: relative; display: flex; flex-direction: column; }
.slip-up-wrap { position: relative; z-index: 1; flex: none; margin: auto var(--gutter) 0; padding-top: 10px; filter: var(--lift-2); }
.reg-lip {                                     /* the register's top edge with the slot; the paper slides under it */
  position: sticky; bottom: 0; z-index: 2;
  flex: none;
  height: 14px;
  margin-top: -9px;
  background: var(--printer);
}
.reg-lip::before { content: ""; position: absolute; left: 10px; right: 10px; top: 5px; height: 8px; border-radius: 4px; background: var(--slot); box-shadow: inset 0 2px 2px rgb(0 0 0 / 0.6), 0 1px 0 rgb(255 255 255 / 0.09); }
.slip-up {
  position: relative;
  background: var(--paper);
  padding: 12px 16px 16px;
  container-type: inline-size;
  -webkit-mask:
    conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) top / 14px 7px repeat-x,
    linear-gradient(#000 0 0) bottom / 100% calc(100% - 7px) no-repeat;
  mask:
    conic-gradient(from 135deg at 50% 0, #000 90deg, #0000 0) top / 14px 7px repeat-x,
    linear-gradient(#000 0 0) bottom / 100% calc(100% - 7px) no-repeat;
}
.slip-up::after {                               /* shade where the paper goes back into the slot */
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 12px;
  background: linear-gradient(rgb(31 35 40 / 0), rgb(31 35 40 / 0.14));
  pointer-events: none;
}
.reg-body {
  position: relative; z-index: 1;
  background: var(--printer);
  padding: 5px calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l));
  --focus: var(--on-printer-pos);
}

/* receipt header: date, note, repeat */
.r-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 28px; margin-top: 2px; }
.r-head-r { display: flex; gap: 6px; }
.mini { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 0 7px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--hair-2); font-size: 13px; font-weight: 600; line-height: 1; color: var(--ink); white-space: nowrap; }
.mini::before { content: ""; position: absolute; inset: -8px -3px; }
.mini:active { background: var(--press); }
.mini .ic { width: 15px; height: 15px; color: var(--ink-2); }
.mini .amt { font-size: 13px; }

/* the item line: description, category */
.desc-line { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 5px; }
.cat-btn { --hue: var(--hue-other); position: relative; flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-tile); background: color-mix(in srgb, var(--hue) var(--tint-mix), var(--paper)); box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink); }

.desc { flex: 1; min-width: 0; height: var(--tap); padding: 0; border: 0; background: none; font-size: 17px; font-weight: 600; color: var(--ink); outline: none; }
.desc.short { flex: 0 0 52px; }
.cat-txt { position: relative; flex: none; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.cat-txt::before { content: ""; position: absolute; inset: -14px -6px; }
.recents { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-mask: linear-gradient(90deg, #000 85%, #0000); mask: linear-gradient(90deg, #000 85%, #0000); }
.recents::-webkit-scrollbar { display: none; }
.rc { position: relative; flex: none; display: inline-flex; align-items: center; height: 32px; padding: 0 10px; border-radius: 10px; background: var(--counter); font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.rc::before { content: ""; position: absolute; inset: -6px -3px; }
.rc:active { background: var(--press); }

/* the amount: right-aligned like a receipt total, caret where the next key lands */
.slip-up .dash { margin: 7px 0 4px; }
.expr .sep { margin: 0 var(--sep-pull); }
.expr { word-spacing: -0.25em; min-height: 20px; margin-top: 6px; padding-top: 6px; text-align: right; font: 500 15px/1.3 var(--font-num); color: var(--ink-2); background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink-2) 55%, transparent) 0 5px, transparent 5px 9px) top / 100% 1.5px no-repeat; }  /* the expression takes the place of the dashed rule */
.amount-line { display: flex; align-items: center; gap: 12px; }
.cur-chip { flex: none; display: inline-flex; align-items: center; gap: 1px; height: var(--tap); padding: 0 6px 0 12px; border-radius: var(--r-chip); box-shadow: inset 0 0 0 1.5px var(--ink); font: 600 15px/1 var(--font-num); color: var(--ink); }

.fx-block { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin: 2px 0 2px; }
.fx-l { min-width: 0; display: grid; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.fx-l .amt { font-weight: 500; }
.fx-r { flex: none; display: grid; justify-items: end; }
.fx-r .amt { font-size: var(--fs-20); line-height: 1.15; color: var(--ink); }
.edit-rate { position: relative; flex: none; font-size: 13px; line-height: 1.5; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.edit-rate::before { content: ""; position: absolute; inset: -12px -8px; }
.slip-up .lead { line-height: 1.55; }
.slip-up .lead .amt { font-size: 16px; }

/* the keys */
.keypad { display: grid; grid-template-columns: 1fr 1fr 1fr 1.22fr; grid-auto-rows: var(--key-h); gap: 6px; }
.key {
  display: grid; place-items: center;

  .bead { width: 46px; }

  .bead:hover, .text-btn:hover, .mini:hover, .rc:hover { background: var(--press); }

<div class="peek" aria-hidden="true"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" data-testid="sheet">
  <div class="grabber" aria-hidden="true"></div>
  <header class="sheet-head">
    <a class="text-btn" href="group.html" data-testid="sheet-close">取消</a>
    <div class="sheet-title">
      <h1 id="sheet-t">新增費用</h1>
      <button class="group-pick" type="button" aria-label="群組：Niseko 滑雪 2026，點一下更換"><svg class="ic glyph" aria-hidden="true"><use href="#t-mountain"/></svg>Niseko 滑雪 2026<svg class="ic dn" aria-hidden="true"><use href="#i-down"/></svg></button>
    </div>
    <span></span>
  </header>

  <div class="sheet-body">
    <p class="who-row">由 <button class="chip" type="button" aria-label="付款人：你，點一下更換" data-testid="editor-payer"><span class="av me" aria-hidden="true">G</span>你<svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button> 付款，<button class="chip" type="button" aria-label="分法：平均分給 6 人，點一下更換" data-testid="editor-split">平均分給 6 人<svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button></p>
    <div class="beads" role="group" aria-label="分給誰，點頭像可排除沒參與的人" data-testid="editor-split-members">
      <button class="bead" type="button" aria-pressed="true" aria-label="你，參與" data-testid="split-check-me"><span class="av me" aria-hidden="true">G</span><span class="check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span><span class="bead-n" aria-hidden="true">你</span></button>
      <button class="bead" type="button" aria-pressed="true" aria-label="Abbie，參與"><span class="av" style="--av:#A16207" aria-hidden="true">A</span><span class="check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span><span class="bead-n" aria-hidden="true">Abbie</span></button>
      <button class="bead" type="button" aria-pressed="true" aria-label="Kevin，參與"><span class="av" style="--av:#2F6FB5" aria-hidden="true">K</span><span class="check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span><span class="bead-n" aria-hidden="true">Kevin</span></button>
      <button class="bead" type="button" aria-pressed="true" aria-label="Tiffany，參與"><span class="av" style="--av:#B91C5C" aria-hidden="true">T</span><span class="check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span><span class="bead-n" aria-hidden="true">Tiffany</span></button>
      <button class="bead" type="button" aria-pressed="true" aria-label="Leo，參與"><span class="av" style="--av:#15803D" aria-hidden="true">L</span><span class="check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span><span class="bead-n" aria-hidden="true">Leo</span></button>
      <button class="bead" type="button" aria-pressed="true" aria-label="佳穎，參與"><span class="av" style="--av:#C2410C" aria-hidden="true">佳</span><span class="check" aria-hidden="true"><svg class="ic"><use href="#i-check"/></svg></span><span class="bead-n" aria-hidden="true">佳穎</span></button>
    </div>
    <p class="hint">點頭像可排除沒參與的人</p>
    <div class="slip-up-wrap">
      <div class="slip-up">
        <div class="r-head">
          <button class="mini" type="button" aria-label="日期：12 月 18 日，今天，點一下更換" data-testid="editor-date"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg><span class="amt">12/18</span> 今天</button>
          <span class="r-head-r">
            <button class="mini" type="button" data-testid="editor-notes"><svg class="ic" aria-hidden="true"><use href="#i-note"/></svg>備註</button>
            <button class="mini" type="button" data-testid="editor-repeat"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg>重複</button>
          </span>
        </div>
        <div class="desc-line">
          <button class="cat-btn" type="button" style="--hue:var(--hue-food)" aria-label="分類：餐廳，自動選的，點一下更換" data-testid="editor-category"><svg class="ic" aria-hidden="true"><use href="#i-dining"/></svg></button>
          <label class="sr-only" for="desc">說明</label>
          <input id="desc" class="desc" name="description" value="燒肉晚餐" enterkeyhint="done" autocomplete="off" data-testid="editor-description">
          <button class="cat-txt" type="button" tabindex="-1" aria-hidden="true">自動分類：餐廳</button>
        </div>
        <hr class="dash">
        <div class="amount-line">
          <button class="cur-chip" type="button" aria-label="幣別：日圓 JPY，點一下更換" data-testid="editor-currency">JPY<svg class="ic" aria-hidden="true"><use href="#i-down"/></svg></button>
          <p class="amount amt amt-display" style="--amt-em:3.75" role="textbox" aria-readonly="true" aria-label="金額 12,600 日圓" data-testid="editor-amount"><span class="cur" aria-hidden="true">¥</span><span aria-hidden="true">12<span class="sep">,</span>600</span><span class="caret" aria-hidden="true"></span></p>
        </div>
        <p class="lead"><span>每人</span><i class="leader" aria-hidden="true"></i><span class="amt">¥2<span class="sep">,</span>100</span></p>
        <p class="lead pos"><span>你借出</span><i class="leader" aria-hidden="true"></i><span class="amt">¥10<span class="sep">,</span>500</span></p>
      </div>
    </div>
    <div class="reg-lip" aria-hidden="true"></div>
  </div>

  <div class="register">
    <div class="reg-body">
      <div class="keypad" role="group" aria-label="輸入金額">
        <button class="key" type="button">1</button>
        <button class="key" type="button">2</button>
        <button class="key" type="button">3</button>
        <button class="key key-op" type="button" aria-label="刪除"><svg class="ic" aria-hidden="true"><use href="#i-del"/></svg></button>
        <button class="key" type="button">4</button>
        <button class="key" type="button">5</button>
        <button class="key" type="button">6</button>
        <button class="key key-op" type="button" aria-label="加"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button class="key" type="button">7</button>
        <button class="key" type="button">8</button>
        <button class="key" type="button">9</button>
        <button class="key key-save" type="button" data-testid="editor-save"><b>儲存</b><small>到 Niseko 滑雪 2026</small></button>
        <button class="key key-000" type="button" aria-label="三個零">000</button>
        <button class="key" type="button">0</button>
        <button class="key key-op" type="button" aria-label="減"><svg class="ic" aria-hidden="true"><use href="#i-minus"/></svg></button>
      </div>
    </div>
  </div>
</section>
</body>
