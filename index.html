<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <script>
      // A friend invite link, https://<site>/i/<code>: the Worker serves this page there with the
      // invite's preview tags (src/worker/routes/invites.ts). The app lives at its base path with
      // hash routes, so the address becomes <base>?<query>#/i/<code> before anything below turns
      // a relative URL into an address or the app reads its route.
      (function () {
        var m = /^(.*\/)i\/([A-Za-z0-9]+)\/?$/.exec(location.pathname);
        if (m) history.replaceState(null, '', m[1] + location.search + '#/i/' + m[2]);
      })();
    </script>

         invite's page has its own title, description and link (src/worker/services/invitePage.ts).
         Absolute URLs, as crawlers need: the production site (staging's invite pages write their own). -->
