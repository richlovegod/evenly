# Evenly API: Cloudflare Worker + D1.
#   Production: npm run api:deploy           -> https://evenly-api.richlovegod.workers.dev
#   Staging:    npm run api:deploy:staging   -> https://evenly-api-staging.richlovegod.workers.dev
# Secrets (never in this file): OWNER_EMAILS (comma separated emails that get the admin page).
#   npx wrangler secret put OWNER_EMAILS [--env staging]

name = "evenly-api"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://richlovegod.github.io"
APP_URL = "https://richlovegod.github.io/evenly/"
ENVIRONMENT = "production"

# Daily at 09:00 UTC: create due recurring expenses, warm today's exchange rates, clean up old rows.
[triggers]
crons = ["0 9 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "evenly-db"
database_id = "36451130-ec61-456b-920c-a5ae54d50f8d"
migrations_dir = "migrations"

[env.staging]
name = "evenly-api-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://127.0.0.1:4173,http://localhost:5173,http://localhost:4173"
APP_URL = "http://127.0.0.1:4173/"
ENVIRONMENT = "staging"
# Test runs create many accounts from one IP.
SIGNUP_PER_HOUR = "1000"
LOGIN_EMAIL_PER_15M = "200"
LOGIN_IP_PER_15M = "1000"
LINK_PER_15M = "200"

[env.staging.triggers]
crons = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "evenly-db-staging"
database_id = "b32a97dc-3204-4feb-8f95-a3c65ca754af"
migrations_dir = "migrations"
