# Gino's Split Lab (code name Evenly): one Cloudflare Worker serves the web app (static assets)
# and the API (/api/*, D1) on the same origin, so the sign-in can live in an HttpOnly cookie.
#   Production: npm run deploy           -> https://split.ginochang.com (and evenly-api.richlovegod.workers.dev)
#   Staging:    npm run deploy:staging   -> https://evenly-api-staging.richlovegod.workers.dev
# Both build the app first (scripts/deploy.sh): [assets] uploads whatever is in ./dist.
# Secrets (never in this file), per environment ([--env staging]):
#   OWNER_EMAILS        comma separated emails that get the admin page
#   VAPID_PRIVATE_JWK   Web Push signing key: node scripts/vapid-keys.mjs [staging]
#   APNS_AUTH_KEY       the APNs auth key for the iPhone app's notifications: Apple's .p8 file as
#                       it is, npx wrangler secret put APNS_AUTH_KEY [--env staging] < AuthKey_<id>.p8
#                       (its id, the team and the bundle id are the APNS_* vars below).
#   RESEND_API_KEY      Resend key that mails the sign-in codes (services/email.ts). Production
#                       answers 503 email_unavailable without it; staging then only echoes codes.
#   GOOGLE_CLIENT_SECRET  the secret of the Google OAuth client named by GOOGLE_CLIENT_ID below
#                       (services/google.ts). Without it, or while GOOGLE_CLIENT_ID is "SET_ME",
#                       the app shows no Google button and /api/auth/google/start sends people to 登入.
#   APPLE_SIGNIN_KEY    the Sign in with Apple key, Apple's .p8 file as it is (services/apple.ts):
#                       npx wrangler secret put APPLE_SIGNIN_KEY [--env staging] < AuthKey_<id>.p8.
#                       Its id, the team, the app's bundle id and the web's Services ID are the
#                       APPLE_* vars below. Without it, the apps show no Apple button.
#   RECEIPT_MODEL       the Workers AI model receipt scans use (the code's default is Gemma 4;
#                       production reads with Qwen 3.8 since 2026-10-29).
#   RECEIPT_JOINT       "on": a scan of two or three photos reads them in one Workers AI call when
#                       the model is in RECEIPT_JOINT_MODELS (services/receipt.ts); unset, one call
#                       per photo. Set it only once the release check passed in that environment
#                       (docs/notes/receipts.md): npx wrangler secret put RECEIPT_JOINT [--env staging].
#                       Never a [vars] entry while the secret exists.
# workers_dev stays on: app versions from before the move (GitHub Pages builds still open on
# phones) call https://evenly-api.richlovegod.workers.dev with a Bearer token.

name = "evenly-api"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false
# The app and the API on https://split.ginochang.com (since 2026-10-17; before, GitHub Pages served the
# app there). A Workers Custom Domain: wrangler deploy attaches it, and Cloudflare keeps its DNS
# record and certificate. Removing this line does not detach it (README: Cutover and rollback).
routes = [{ pattern = "split.ginochang.com", custom_domain = true }]

# The built web app. /api/* always runs the Worker, and so do page loads of the app itself ("/":
# the Worker renews the session cookies on the page response, src/worker/index.ts), friend
# invite links ("/i/<code>": the app's page with the invite's preview tags, which the Worker writes
# in), the associated domain file that names the iPhone app, and the iPhone app's way back from
# Google ("/app/auth/google"); everything else is a file. A path with no file reaches the Worker too (not_found_handling
# "none"): never index.html, which a missing /assets/*.js would otherwise get with its year-long
# immutable header. Inherited by [env.staging], which repeats it below to be explicit.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/", "/index.html", "/i/*", "/.well-known/apple-app-site-association", "/app/*"]

[ai]
binding = "AI"

# Receipt photos kept with their expenses (routes/receiptPhotos.ts): key receipt:<expenseId>:<version>.
# Workers Paid (since 2026-10-29) includes 1 GB stored, 1,000,000 writes and 10,000,000 reads a month
# of KV for the whole Cloudflare account, all five namespaces together (this one, staging's below,
# award-relay's two and study-sync's), and bills what goes past them. The Worker stays under them
# (RECEIPT_STORE_MAX_BYTES, RECEIPT_KV_WRITES_PER_DAY). Not inherited by [env.staging], which names
# its own.
[[kv_namespaces]]
binding = "RECEIPTS"
id = "ec4c328ffc384a7998352105b332f46d"

[vars]
# Cross-origin callers that may read API answers (old app builds on GitHub Pages). The app on
# its own origin needs no CORS.
ALLOWED_ORIGINS = "https://split.ginochang.com,https://richlovegod.github.io"
APP_URL = "https://split.ginochang.com/"
ENVIRONMENT = "production"
# Web Push (RFC 8292). The private half is the VAPID_PRIVATE_JWK secret.
VAPID_PUBLIC_KEY = "BBQud4_qE1XmHw0mM4JoX3MnGtlAESxSVQh_wOFK1vPoTzSAxwKVh4U5fCVN6oHOChRNSkAbWU3280hbdhcKNBQ"
VAPID_SUBJECT = "mailto:gino@ginochang.com"
# The iPhone app's notifications (services/apns.ts): the APNs auth key's id (one key, team scoped,
# serves the sandbox and production), the Apple Developer team, and the app's bundle id, the
# apns-topic. The key itself is the APNS_AUTH_KEY secret.
APNS_KEY_ID = "U47HW6ZSNN"
APNS_TEAM_ID = "7XHV5223X7"
APNS_TOPIC = "com.ginochang.evenly"
# At most 8 push messages a run, not the default 12: on staging a run that sent 10 used 9 to 11 ms
# of CPU, and Workers Free allows 10 ms (docs/notes/push.md, Limits and cost).
PUSH_MAX_PER_RUN = "8"
# The sender of the sign-in code emails (Resend, with ginochang.com verified there). Replies go to
# gino@ginochang.com (services/email.ts).
EMAIL_FROM = "吉諾分帳所 <login@ginochang.com>"
# Receipt photos: at most 500 KV writes a UTC day (the code's default is 900), about 15,500 a month,
# and staging's 60 a day about 1,900: far under the 1,000,000 a month Workers Paid includes for the
# account, which the award-relay and study-sync Workers share. The photos may keep 800,000,000 bytes
# (the code's default RECEIPT_STORE_MAX_BYTES) of the account's 1 GB: staging takes 30,000,000, and
# the rest is for the other Workers' namespaces and old objects whose delete failed.
RECEIPT_KV_WRITES_PER_DAY = "500"
# Receipt scans: Workers AI neurons a UTC day (routes/receipts.ts; the code's default here too). The
# account's free 10,000 a day are shared with staging (500 there), and Workers Paid bills what goes
# past them, so production stops at 8,000; the 1,500 left are for model comparisons run straight
# against the REST API, which no Worker counts. A scan is refused (429 scope ai) when today's
# neurons plus its worst case (services/receipt.ts receiptWorstCase) would pass this. With Qwen 3.8,
# the RECEIPT_MODEL secret since 2026-10-29: one photo sets aside 764 and uses about 180 (about 41
# scans a day); three photos in one call set aside 1,626 and use about 500 (about 13 a day), and
# one call per photo 2,292 for about 650 (about 10). More photos per tap only use the day up sooner.
RECEIPT_NEURONS_PER_DAY = "8000"
# Sign in with Google (services/google.ts): the OAuth client id from the Google Cloud console
# (Credentials, a Web application client); its secret is GOOGLE_CLIENT_SECRET. "SET_ME" is a
# placeholder that counts as not set: no Google button until it is the real id.
GOOGLE_CLIENT_ID = "1001778648486-ehq3min33vaor5pnor33oeffs9b91m82.apps.googleusercontent.com"
# Sign in with Apple (services/apple.ts): the key's id ("Evenly Sign in with Apple", Sign in with
# Apple only, primary App ID com.ginochang.evenly), the Apple Developer team, the iPhone app's
# client_id (its bundle id, the primary App ID) and the web's (the Services ID, grouped with the
# App ID, so a person's Apple user id is the same in both). The web's return URLs, registered on
# the Services ID: https://split.ginochang.com/api/auth/apple/callback and staging's. The key
# itself is the APPLE_SIGNIN_KEY secret.
APPLE_SIGNIN_KEY_ID = "GHDBRV8WZW"
APPLE_TEAM_ID = "7XHV5223X7"
APPLE_APP_ID = "com.ginochang.evenly"
APPLE_SERVICES_ID = "com.ginochang.evenly.web"

# Daily at 09:00 UTC: create due recurring expenses, warm today's exchange rates, clean up old rows.
# Every minute: send the push notifications whose hold time has passed (services/push.ts).
# The account has 5 Cron Triggers on the Free plan; award-relay uses 2, this Worker 2.
[triggers]
crons = ["0 9 * * *", "* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "evenly-db"
database_id = "36451130-ec61-456b-920c-a5ae54d50f8d"
migrations_dir = "migrations"

[env.staging]
name = "evenly-api-staging"
workers_dev = true
preview_urls = false
# Required: routes are inherited, and an inherited custom domain would move to the staging Worker.
routes = []

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/", "/index.html", "/i/*", "/.well-known/apple-app-site-association", "/app/*"]

[env.staging.ai]
binding = "AI"

[env.staging.vars]
# vite dev and vite preview (tests) call staging cross-origin with a Bearer token.
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://127.0.0.1:4173,http://localhost:5173,http://localhost:4173"
APP_URL = "https://evenly-api-staging.richlovegod.workers.dev/"
ENVIRONMENT = "staging"
VAPID_PUBLIC_KEY = "BOz_wPKbLjJoUqyHOOd_hIzlSrEEsqM7LLI4HgiOjW_yHg9kxiB4aHKPDQi6VJGbnc6nsETv29CqOkVYSyYBsJQ"
VAPID_SUBJECT = "mailto:gino@ginochang.com"
# The same APNs key, team and bundle id as production; staging's own APNS_AUTH_KEY secret.
APNS_KEY_ID = "U47HW6ZSNN"
APNS_TEAM_ID = "7XHV5223X7"
APNS_TOPIC = "com.ginochang.evenly"
# Push sends right away on staging (production holds 30 s to merge bursts and drop undone entries).
PUSH_HOLD_SECONDS = "0"
# As in production, so what is measured here holds there.
PUSH_MAX_PER_RUN = "8"
# Test runs create many accounts from one IP.
SIGNUP_PER_HOUR = "1000"
LOGIN_EMAIL_PER_15M = "200"
LOGIN_IP_PER_15M = "1000"
LINK_PER_15M = "200"
# Looks at a friend invite without signing in (GET /api/invite/:code; production keeps the default 30).
INVITE_IP_PER_15M = "1000"
# Workers AI's free 10,000 neurons a day are per account, shared with production (8,000 there), and
# Workers Paid bills what goes past them: staging may use only a small slice, 40 photos read and
# 500 neurons a day (500 is also the code's default outside production). That is about 18 scans of
# one photo with Gemma 4 (114 set aside, about 20 used), or about 6 of three photos in one call
# (250, about 45) and 3 with one call per photo (342); Llama 4 Scout fits only early in the day,
# and Qwen 3.8 never does: its worst case alone passes 500.
RECEIPT_GLOBAL_PER_DAY = "120"
RECEIPT_NEURONS_PER_DAY = "1500"
# Receipt photos: the account's KV allowance is shared with production (500 writes a day and
# 800,000,000 bytes there), so staging keeps a small slice of it.
RECEIPT_KV_WRITES_PER_DAY = "300"
RECEIPT_STORE_MAX_BYTES = "30000000"
EMAIL_FROM = "吉諾分帳所 <login@ginochang.com>"
# Test mode: the email start routes also answer with the code (devCode), so staging works without
# RESEND_API_KEY and the UI tests read the code. The Worker never honors it in production.
EMAIL_DEV_ECHO = "1"
# Test runs ask for many codes from one IP.
EMAIL_IP_PER_HOUR = "1000"
# Resend's 100 emails a day belong to the Resend account: if staging gets the key too, it may mail
# only a slice of them (production keeps the default 90). Test addresses (.test) are never mailed.
EMAIL_GLOBAL_PER_DAY = "10"
# Sign in with Google: the same client as production can serve staging (both callbacks are
# registered on it), or a client of its own; "SET_ME" counts as not set. Secret: GOOGLE_CLIENT_SECRET
# (--env staging).
GOOGLE_CLIENT_ID = "1001778648486-ehq3min33vaor5pnor33oeffs9b91m82.apps.googleusercontent.com"
# Sign in with Apple: the same key, team, App ID and Services ID as production (staging's return
# URL is registered on the Services ID too); staging's own APPLE_SIGNIN_KEY secret.
APPLE_SIGNIN_KEY_ID = "GHDBRV8WZW"
APPLE_TEAM_ID = "7XHV5223X7"
APPLE_APP_ID = "com.ginochang.evenly"
APPLE_SERVICES_ID = "com.ginochang.evenly.web"

# No cron on staging (the account's Cron Trigger slots are used up): tests run the push sender
# with POST /api/push/run.
[env.staging.triggers]
crons = []

[[env.staging.kv_namespaces]]
binding = "RECEIPTS"
id = "aa5d755e73a6461e9e7119438c3af2c4"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "evenly-db-staging"
database_id = "b32a97dc-3204-4feb-8f95-a3c65ca754af"
migrations_dir = "migrations"
