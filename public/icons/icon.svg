<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Evenly</title>
  <!-- Evenly app mark (design/PICTUREBOOK.md): the mascot, the award site's robot recolored for
       Evenly (yolk face, coral cheeks, paper eyes), drawn in the family's 3 px ink line on its
       40 x 40 grid and scaled 9 times, standing on a grass mound, on sky tint (token water-t,
       #E6F2F8). The award site's icon is the coral robot on paper, so the two tell apart on a
       home screen. tmp/pb/shell/render-icons.cjs renders the PNGs from this file: it squares the
       corners of #bg for the full-bleed icons and scales #mark into the maskable safe zone
       (everything in #mark stays inside the central 80 percent circle). Comments here must never
       contain two hyphens in a row (invalid XML). -->
  <rect id="bg" width="512" height="512" rx="112" fill="#E6F2F8"/>
  <g id="mark">
    <path d="M112 448C160 378 352 378 400 448Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="22" stroke-linejoin="round"/>
    <g transform="translate(76 58) scale(9)" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M20 3v6"/>
      <circle cx="20" cy="3" r="1.5" fill="#3E3A39"/>
      <rect x="6" y="9" width="28" height="24" rx="9" fill="#F6D27A"/>
      <ellipse cx="10.6" cy="26" rx="2.2" ry="1.5" fill="#F2A497" stroke="none"/>
      <ellipse cx="29.4" cy="26" rx="2.2" ry="1.5" fill="#F2A497" stroke="none"/>
      <circle cx="14.5" cy="19" r="4.2" fill="#FFFCF6"/>
      <circle cx="25.5" cy="19" r="4.2" fill="#FFFCF6"/>
      <circle cx="14.5" cy="19" r="1.4" fill="#3E3A39" stroke="none"/>
      <circle cx="25.5" cy="19" r="1.4" fill="#3E3A39" stroke="none"/>
      <path d="M16.5 27q3.5 3 7 0"/>
      <path d="M11 38l3-5M29 38l-3-5"/>
    </g>
  </g>
</svg>
